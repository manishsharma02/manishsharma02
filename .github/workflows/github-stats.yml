name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout Repository
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # Generate GitHub Stats
      # --------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Generate Top Languages
      # --------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Generate Contribution Calendar
      # --------------------------------
      - name: Generate Contribution Calendar
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import re
          import urllib.request
          from datetime import datetime

          username = os.environ["GITHUB_USERNAME"]

          url = f"https://github.com/users/{username}/contributions"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          html = urllib.request.urlopen(request).read().decode("utf-8")

          # Find all contribution calendar cells
          pattern = r'<td[^>]*ContributionCalendar-day[^>]*>'

          cell_tags = re.findall(pattern, html)

          cells = []

          for tag in cell_tags:

              date_match = re.search(
                  r'data-date="([^"]+)"',
                  tag
              )

              level_match = re.search(
                  r'data-level="(\d+)"',
                  tag
              )

              if date_match and level_match:

                  date = datetime.strptime(
                      date_match.group(1),
                      "%Y-%m-%d"
                  )

                  level = int(
                      level_match.group(1)
                  )

                  cells.append(
                      {
                          "date": date,
                          "level": level
                      }
                  )

          if not cells:
              raise Exception(
                  "GitHub contribution calendar could not be read."
              )

          print(
              f"Found {len(cells)} contribution days."
          )

          # Latest 53 weeks
          cells = cells[-371:]

          # Remove incomplete beginning
          remainder = len(cells) % 7

          if remainder:
              cells = cells[remainder:]

          weeks = []

          for i in range(0, len(cells), 7):

              week = cells[i:i + 7]

              if len(week) == 7:
                  weeks.append(week)

          # --------------------------------
          # SVG SETTINGS
          # --------------------------------

          cell_size = 12
          gap = 3

          left = 42
          top = 32

          width = (
              left
              + len(weeks) * (cell_size + gap)
              + 15
          )

          height = (
              top
              + 7 * (cell_size + gap)
              + 45
          )

          # GitHub-style contribution colors
          colors = {
              0: "#ebedf0",
              1: "#9be9a8",
              2: "#40c463",
              3: "#30a14e",
              4: "#216e39"
          }

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" '
              f'height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          # Background
          svg.append(
              f'<rect width="{width}" '
              f'height="{height}" '
              f'fill="#ffffff" rx="6"/>'
          )

          # --------------------------------
          # DAY LABELS
          # --------------------------------

          day_labels = {
              1: "Mon",
              3: "Wed",
              5: "Fri"
          }

          for row, label in day_labels.items():

              y = (
                  top
                  + row * (cell_size + gap)
                  + 10
              )

              svg.append(
                  f'<text x="2" y="{y}" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="10" '
                  f'fill="#57606a">'
                  f'{label}'
                  f'</text>'
              )

          # --------------------------------
          # MONTH LABELS
          # --------------------------------

          previous_month = None

          for x, week in enumerate(weeks):

              date = week[0]["date"]

              if date.month != previous_month:

                  month = date.strftime("%b")

                  x_position = (
                      left
                      + x * (cell_size + gap)
                  )

                  svg.append(
                      f'<text '
                      f'x="{x_position}" '
                      f'y="16" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="11" '
                      f'fill="#24292f">'
                      f'{month}'
                      f'</text>'
                  )

                  previous_month = date.month

          # --------------------------------
          # CONTRIBUTION BOXES
          # --------------------------------

          for x, week in enumerate(weeks):

              for y, cell in enumerate(week):

                  level = cell["level"]

                  color = colors.get(
                      level,
                      colors[0]
                  )

                  x_position = (
                      left
                      + x * (cell_size + gap)
                  )

                  y_position = (
                      top
                      + y * (cell_size + gap)
                  )

                  date_text = cell["date"].strftime(
                      "%b %d, %Y"
                  )

                  svg.append(
                      f'<rect '
                      f'x="{x_position}" '
                      f'y="{y_position}" '
                      f'width="{cell_size}" '
                      f'height="{cell_size}" '
                      f'rx="2" ry="2" '
                      f'fill="{color}">'
                  )

                  svg.append(
                      f'<title>'
                      f'{date_text}: '
                      f'contribution level {level}'
                      f'</title>'
                  )

                  svg.append("</rect>")

          # --------------------------------
          # LEGEND
          # --------------------------------

          legend_y = (
              top
              + 7 * (cell_size + gap)
              + 22
          )

          svg.append(
              f'<text '
              f'x="{left}" '
              f'y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" '
              f'fill="#57606a">'
              f'Less'
              f'</text>'
          )

          for i in range(5):

              x_position = (
                  left
                  + 30
                  + i * (cell_size + gap)
              )

              svg.append(
                  f'<rect '
                  f'x="{x_position}" '
                  f'y="{legend_y - 10}" '
                  f'width="{cell_size}" '
                  f'height="{cell_size}" '
                  f'rx="2" '
                  f'fill="{colors[i]}"/>'
              )

          svg.append(
              f'<text '
              f'x="{left + 30 + 5 * (cell_size + gap) + 5}" '
              f'y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" '
              f'fill="#57606a">'
              f'More'
              f'</text>'
          )

          svg.append("</svg>")

          # --------------------------------
          # SAVE SVG
          # --------------------------------

          os.makedirs(
              "profile",
              exist_ok=True
          )

          output_file = (
              "profile/activity-graph.svg"
          )

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(svg)
              )

          print(
              f"Successfully generated: {output_file}"
          )
          PY

      # --------------------------------
      # Commit Generated Files
      # --------------------------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats and contribution calendar"

          git push
