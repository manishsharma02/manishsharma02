name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout Repository
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # Generate GitHub Stats
      # --------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Generate Top Languages
      # --------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Generate Contribution Calendar
      # --------------------------------
      # --------------------------------
      # Generate GitHub Contribution Calendar
      # --------------------------------
      - name: Generate Contribution Calendar
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import re
          import urllib.request
          from datetime import datetime, timedelta

          username = os.environ["GITHUB_USERNAME"]

          url = f"https://github.com/users/{username}/contributions"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          html = urllib.request.urlopen(request).read().decode("utf-8")

          # --------------------------------
          # READ GITHUB CONTRIBUTION CELLS
          # --------------------------------

          tags = re.findall(
              r'<td[^>]*ContributionCalendar-day[^>]*>',
              html
          )

          contributions = {}

          for tag in tags:

              date_match = re.search(
                  r'data-date="([^"]+)"',
                  tag
              )

              level_match = re.search(
                  r'data-level="(\d+)"',
                  tag
              )

              if date_match and level_match:

                  date = datetime.strptime(
                      date_match.group(1),
                      "%Y-%m-%d"
                  ).date()

                  level = int(
                      level_match.group(1)
                  )

                  contributions[date] = level

          if not contributions:
              raise Exception(
                  "Could not read GitHub contribution calendar."
              )

          print(
              f"Found {len(contributions)} contribution days."
          )

          # --------------------------------
          # CREATE LAST 53 WEEKS
          # --------------------------------

          latest_date = max(contributions.keys())

          # GitHub calendar weeks run Sunday -> Saturday.
          last_sunday = latest_date - timedelta(
              days=(latest_date.weekday() + 1) % 7
          )

          first_sunday = last_sunday - timedelta(
              weeks=52
          )

          weeks = []

          current = first_sunday

          for week_number in range(53):

              week = []

              for row in range(7):

                  day = current + timedelta(
                      days=row
                  )

                  level = contributions.get(
                      day,
                      0
                  )

                  week.append(
                      {
                          "date": day,
                          "level": level
                      }
                  )

              weeks.append(week)

              current += timedelta(
                  weeks=1
              )

          # --------------------------------
          # SVG SETTINGS
          # --------------------------------

          cell = 11
          gap = 3

          left = 32
          right = 18
          top = 32
          bottom = 38

          columns = len(weeks)

          width = (
              left
              + columns * (cell + gap)
              - gap
              + right
          )

          height = (
              top
              + 7 * (cell + gap)
              - gap
              + bottom
          )

          # GitHub-style colors
          colors = {
              0: "#ebedf0",
              1: "#9be9a8",
              2: "#40c463",
              3: "#30a14e",
              4: "#216e39"
          }

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" '
              f'height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          # --------------------------------
          # BACKGROUND
          # --------------------------------

          svg.append(
              f'<rect width="{width}" '
              f'height="{height}" '
              f'fill="#ffffff"/>'
          )

          # --------------------------------
          # DAY LABELS
          # --------------------------------

          labels = {
              1: "Mon",
              3: "Wed",
              5: "Fri"
          }

          for row, label in labels.items():

              y = (
                  top
                  + row * (cell + gap)
                  + 9
              )

              svg.append(
                  f'<text '
                  f'x="0" '
                  f'y="{y}" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="9" '
                  f'fill="#57606a">'
                  f'{label}'
                  f'</text>'
              )

          # --------------------------------
          # MONTH LABELS
          # --------------------------------

          previous_month = None

          for x, week in enumerate(weeks):

              first_day = week[0]["date"]

              month = first_day.month

              if month != previous_month:

                  month_name = first_day.strftime(
                      "%b"
                  )

                  x_position = (
                      left
                      + x * (cell + gap)
                  )

                  svg.append(
                      f'<text '
                      f'x="{x_position}" '
                      f'y="16" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="10" '
                      f'fill="#24292f">'
                      f'{month_name}'
                      f'</text>'
                  )

                  previous_month = month

          # --------------------------------
          # CONTRIBUTION BOXES
          # --------------------------------

          total_contributions = 0

          for x, week in enumerate(weeks):

              for row, item in enumerate(week):

                  level = item["level"]

                  if level > 0:
                      total_contributions += 1

                  color = colors.get(
                      level,
                      colors[0]
                  )

                  x_position = (
                      left
                      + x * (cell + gap)
                  )

                  y_position = (
                      top
                      + row * (cell + gap)
                  )

                  date_text = item[
                      "date"
                  ].strftime(
                      "%b %d, %Y"
                  )

                  svg.append(
                      f'<rect '
                      f'x="{x_position}" '
                      f'y="{y_position}" '
                      f'width="{cell}" '
                      f'height="{cell}" '
                      f'rx="2" '
                      f'ry="2" '
                      f'fill="{color}">'
                  )

                  svg.append(
                      f'<title>'
                      f'{date_text}'
                      f'</title>'
                  )

                  svg.append(
                      '</rect>'
                  )

          # --------------------------------
          # LEGEND
          # --------------------------------

          legend_y = (
              top
              + 7 * (cell + gap)
              + 21
          )

          svg.append(
              f'<text '
              f'x="{left}" '
              f'y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="9" '
              f'fill="#57606a">'
              f'Less'
              f'</text>'
          )

          for i in range(5):

              x_position = (
                  left
                  + 27
                  + i * (cell + gap)
              )

              svg.append(
                  f'<rect '
                  f'x="{x_position}" '
      # --------------------------------
      # Commit Generated Files
      # --------------------------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats and contribution calendar"

          git push
