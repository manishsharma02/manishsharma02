name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Generate GitHub Stats
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate Top Languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate GitHub Contribution Calendar
      - name: Generate Contribution Calendar
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import os
          import re
          import urllib.request
          from datetime import datetime

          username = os.environ["GITHUB_USERNAME"]

          url = f"https://github.com/users/{username}/contributions"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          html = urllib.request.urlopen(request).read().decode("utf-8")

          # Read GitHub's real contribution boxes
          pattern = r'<td[^>]*class="[^"]*ContributionCalendar-day[^"]*"[^>]*data-date="([^"]+)"[^>]*data-level="(\d+)"'

          matches = re.findall(pattern, html)

          if not matches:
              raise Exception("Could not read GitHub contribution calendar.")

          # Last 371 days = 53 weeks × 7 days
          matches = matches[-371:]

          cells = []

          for date_str, level in matches:
              date = datetime.strptime(date_str, "%Y-%m-%d")
              cells.append({
                  "date": date,
                  "level": int(level)
              })

          # Group into weeks
          weeks = []

          for i in range(0, len(cells), 7):
              week = cells[i:i+7]
              if len(week) == 7:
                  weeks.append(week)

          # SVG settings
          cell_size = 12
          gap = 3

          left = 45
          top = 35

          width = left + len(weeks) * (cell_size + gap) + 15
          height = top + 7 * (cell_size + gap) + 45

          # GitHub contribution colors
          colors = {
              0: "#ebedf0",
              1: "#9be9a8",
              2: "#40c463",
              3: "#30a14e",
              4: "#216e39"
          }

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          # White background
          svg.append(
              f'<rect width="{width}" height="{height}" fill="white" rx="6"/>'
          )

          # Day labels
          day_labels = {
              1: "Mon",
              3: "Wed",
              5: "Fri"
          }

          for row, label in day_labels.items():
              y = top + row * (cell_size + gap) + 10

              svg.append(
                  f'<text x="2" y="{y}" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="10" fill="#57606a">{label}</text>'
              )

          # Month labels
          previous_month = None

          for x, week in enumerate(weeks):

              if not week:
                  continue

              date = week[0]["date"]

              if date.month != previous_month:

                  month = date.strftime("%b")

                  x_position = left + x * (cell_size + gap)

                  svg.append(
                      f'<text x="{x_position}" y="18" '
                      f'font-family="Arial, sans-serif" '
                      f'font-size="11" fill="#57606a">{month}</text>'
                  )

                  previous_month = date.month

          # Contribution boxes
          for x, week in enumerate(weeks):

              for y, cell in enumerate(week):

                  level = cell["level"]

                  color = colors.get(level, colors[0])

                  x_position = left + x * (cell_size + gap)
                  y_position = top + y * (cell_size + gap)

                  date = cell["date"].strftime("%b %d, %Y")

                  svg.append(
                      f'<rect x="{x_position}" y="{y_position}" '
                      f'width="{cell_size}" height="{cell_size}" '
                      f'rx="2" ry="2" fill="{color}">'
                  )

                  svg.append(
                      f'<title>{date}: contribution level {level}</title>'
                  )

                  svg.append('</rect>')

          # Legend
          legend_y = top + 7 * (cell_size + gap) + 22

          svg.append(
              f'<text x="{left}" y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" fill="#57606a">Less</text>'
          )

          for i in range(5):

              x_position = left + 30 + i * (cell_size + gap)

              svg.append(
                  f'<rect x="{x_position}" y="{legend_y - 10}" '
                  f'width="{cell_size}" height="{cell_size}" '
                  f'rx="2" fill="{colors[i]}"/>'
              )

          svg.append(
              f'<text x="{left + 30 + 5 * (cell_size + gap) + 5}" '
              f'y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10" fill="#57606a">More</text>'
          )

          svg.append("</svg>")

          os.makedirs("profile", exist_ok=True)

          with open("profile/activity-graph.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(svg))

          print("Contribution calendar generated successfully.")
          PY

      # Commit generated SVG files
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats and contribution calendar"

          git push
